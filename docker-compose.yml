services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: fraud_detection_db
    environment:
      POSTGRES_DB: fraud_detection
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # Python Fraud Detection API
  fraud-api:
    build:
      context: ./backend/fraud-api
      dockerfile: Dockerfile
    container_name: fraud_detection_api
    ports:
      - "8000:8000"
    volumes:
      - fraud_models:/app/models  # Persist trained models
      - ./fraud-api:/app          # Development volume mount
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Backend Spring Boot Application
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: fraud_detection_backend
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/fraud_detection
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - FRAUD_DETECTION_API_URL=http://fraud-api:8000  # Internal Docker network URL
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_started
      fraud-api:
        condition: service_healthy
    restart: unless-stopped

  # Frontend Next.js Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: fraud_detection_frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
    volumes:
      - ./frontend:/app          
      - /app/node_modules        
    command: npm run dev        

volumes:
  postgres_data:
  fraud_models: